<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved (or OS-preferred) theme before first paint to avoid a flash.
      // Keep in sync with src/lib/theme.ts. An explicit data-theme is always set, so the
      // user's toggle can never be overridden by the OS-preference fallback in tokens.css.
      (function () {
        var theme = 'night';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'night' || saved === 'lab') theme = saved;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'lab';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
