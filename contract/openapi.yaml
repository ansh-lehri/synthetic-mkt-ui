openapi: 3.0.3
info:
  title: Synthetic Market Simulator — REST contract
  version: 0.2.0
  description: >
    Single source of truth for the REST surface, rewritten (Phase 1 of
    BACKEND-INTEGRATION-PLAN.md) to describe the REAL backend's actual wire shapes —
    see contract/REWRITE-DIFF.md for exactly what changed from the previous,
    invented-mock version of this file.

    Three axes: broker (account/order, account_id-keyed, under /v1/account and
    /v1/orders), market-data (public, instrument-keyed, under /v1/candles + /v1/ws),
    and session/identity (under /v1/account/open, /v1/markets, /v1/instruments, and
    the unversioned /session/* routes — this split between /v1/ and bare /session/
    paths is in the real backend as shipped, not a documentation inconsistency).

    Conventions: all money and prices are bare int64 (no currency field anywhere);
    enums are lowercase snake_case strings; there is NO single timestamp convention —
    broker reads use RFC3339, on-demand session timers use RFC3339Nano, candle/WS
    timestamps use naive-local ISO-8601 paired with a `timezone` field, and
    GET /v1/markets uses plain RFC3339 UTC. Each schema below says explicitly which
    one it uses. No auth anywhere: account_id/user_id are passed explicitly and
    trusted verbatim (confirmed — this is a documented "no-auth demo surface" on the
    real backend, not a gap introduced by this contract).
servers:
  - url: /
    description: Base URL is swapped (mock vs real) by the frontend client; paths are identical.

tags:
  - name: identity
  - name: orders
  - name: money
  - name: account-live
  - name: account-durable
  - name: market-data
  - name: session

paths:

  # ============================ IDENTITY / ACCOUNT ============================

  /v1/account/open:
    post:
      tags: [identity]
      summary: Signup/login handshake. Idempotent — same call for first signup and every later login.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountOpenRequest' }
      responses:
        '200':
          description: Same account_id returned every time for the same user_id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountOpenResponse' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
        '504': { $ref: '#/components/responses/ErrorEnvelope' }

  /v1/account/cash:
    get:
      tags: [identity]
      summary: Pre-session cash view. Use this before a session exists; use /v1/account/balance once one does.
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cash' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '404':
          description: account_id does not resolve to any account row (the one broker/reads endpoint that 404s).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }

  # ============================ BROKER — ORDERS ============================

  /v1/orders:
    post:
      tags: [orders]
      summary: Place order (202 = accepted, not executed — poll for terminal state)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '202':
          description: Locally accepted and punched to the exchange.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderIdResponse' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '409':
          description: No live session (reason=no_session).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReasonEnvelope' }
        '422':
          description: >
            Business reject. reason ∈ {unknown_instrument, bad_qty, bad_side,
            bad_price, bad_type, insufficient_funds, no_market_price}. no_market_price
            is reachable (market-buy pricing works once the exchange instance is
            wired and the instrument has printed a quote) — not an unconditional
            reject.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReasonEnvelope' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '504': { $ref: '#/components/responses/ErrorEnvelope' }

  /v1/orders/cancel:
    post:
      tags: [orders]
      summary: Cancel order (202 = cancel accepted locally, NOT "cancelled")
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelOrderRequest' }
      responses:
        '202':
          description: Cancel accepted locally and punched. Outcome arrives async. Repeating a cancel already in flight returns the same 202 without re-punching (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderIdResponse' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '409':
          description: >
            reason ∈ {no_session, unknown_order, not_cancellable}.
            unknown_order deliberately merges "not found" and "belongs to another account".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReasonEnvelope' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '504': { $ref: '#/components/responses/ErrorEnvelope' }

  /v1/orders/modify:
    post:
      tags: [orders]
      summary: Modify order (composed cancel+replace; can leave you with no order)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifyOrderRequest' }
      responses:
        '200':
          description: modify_status = "ok" or "partial". Surface warning verbatim on partial.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModifyResponse' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '409':
          description: modify_status = "rejected" (cancel leg failed; no place attempted).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModifyResponse' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '504': { $ref: '#/components/responses/ErrorEnvelope' }

  # ============================ BROKER — MONEY ============================

  /v1/account/transfer:
    post:
      tags: [money]
      summary: Bank ↔ trading transfer. Never emits 409 (confirmed by a real-backend regression test).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '200':
          description: Post-move balances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResponse' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '422':
          description: Insufficient funds (error envelope, not reason).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
        '504': { $ref: '#/components/responses/ErrorEnvelope' }

  # ===================== BROKER — LIVE ACCOUNT READS =====================

  /v1/account/balance:
    get:
      tags: [account-live]
      summary: Four cash buckets of the live account. Requires a live session.
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '409':
          description: 'Exact body: {"error":"no live session for account"}.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '504': { $ref: '#/components/responses/ErrorEnvelope' }

  /v1/account/positions:
    get:
      tags: [account-live]
      summary: Open positions. mark_available is conditionally true (per-instance wiring + first trade), not permanently false.
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
        - name: instrument
          in: query
          required: false
          schema: { type: string }
          description: Optional single-instrument filter. Flat on an instrument → empty, not an error.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionsResponse' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '504': { $ref: '#/components/responses/ErrorEnvelope' }

  /v1/account/orders:
    get:
      tags: [account-live]
      summary: Working set only (working / partially_filled). No instrument filter exists on this endpoint.
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdersResponse' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '504': { $ref: '#/components/responses/ErrorEnvelope' }

  /v1/account/observation:
    get:
      tags: [account-live]
      summary: PREFERRED dashboard read — atomic balance+positions+orders + recent trades (confirmed real, a genuine bundle).
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
      responses:
        '200':
          description: >
            Atomic live snapshot. trades_degraded=true means the durable half failed
            (recent_trades=[]) but the live half is correct — still 200.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Observation' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '504': { $ref: '#/components/responses/ErrorEnvelope' }

  # =================== BROKER — DURABLE ACCOUNT READS ===================

  /v1/account/trades:
    get:
      tags: [account-durable]
      summary: Closed trades, keyset-paginated newest-first. Empty is 200, never 404/409/504.
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1 }
          description: No client-visible upper bound; silently clamps to the server's internal cap (500) rather than erroring.
        - name: before
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: RFC3339. Pass the previous response's next_before to page older.
      responses:
        '200':
          description: OK (incl. empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradesPage' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }

  /v1/account/pnl:
    get:
      tags: [account-durable]
      summary: Account-wide P&L aggregate. A separate endpoint from /trades (no summary= flag). Empty account → zero-filled 200.
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PnlSummary' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }

  /v1/account/costs:
    get:
      tags: [account-durable]
      summary: Per-trade cost/tax breakdown. Country-dispatched (IN only; US → 501). A separate endpoint from costs/summary.
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
        - { $ref: '#/components/parameters/Country' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1 }
        - name: before
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK (incl. empty). Only non-zero cost lines are present. Response key is "trades".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostsPage' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '501': { $ref: '#/components/responses/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }

  /v1/account/costs/summary:
    get:
      tags: [account-durable]
      summary: Account-wide cost aggregate. Same country rules as /costs. A separate endpoint, not a sub-key of /costs.
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
        - { $ref: '#/components/parameters/Country' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostsSummary' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '501': { $ref: '#/components/responses/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }

  # ===================== MARKET-DATA — CANDLE HISTORY =====================

  /v1/candles:
    get:
      tags: [market-data]
      summary: >
        Candle history (pull). Durable-read family: 200 (incl. empty) / 400 / 503 / 405.
        Never 404/409/504. Times are naive-local ISO; timezone named in the response.
        next_cursor is in a DIFFERENT, non-standard format from broker/reads' RFC3339
        `before` cursor — do not assume one cursor format applies everywhere on this API.
      parameters:
        - name: market
          in: query
          required: true
          schema: { type: string, example: IN }
        - name: instrument
          in: query
          required: true
          schema: { type: string, example: ACME }
          description: Not validated against a known-instrument list here; an unknown instrument yields an empty page, not an error.
        - name: timeframe
          in: query
          required: true
          schema: { type: string, enum: ["1m", "5m", "30m", "60m"] }
        - name: from
          in: query
          required: true
          schema: { type: string, example: "2026-10-09T09:15:00" }
          description: Naive-local ISO-8601 in the market's timezone.
        - name: to
          in: query
          required: true
          schema: { type: string, example: "2026-10-09T15:30:00" }
          description: Must be strictly after from.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Pass the previous response's next_cursor to page forward. Naive-local, non-RFC3339.
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100 }
          description: Default 100, server hard cap 500 (silently clamped, not rejected). 0 or negative → 400.
      responses:
        '200':
          description: OK (incl. empty candles[])
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandleResponse' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }

  /v1/ws:
    get:
      tags: [market-data]
      summary: >
        WebSocket upgrade for live price/quote/depth/candle streaming. Requires a
        session id from a prior session/canonical or session/ondemand call — this
        socket is NOT anonymous (unlike the old mock-era contract). Message framing
        is documented in ws-schemas.md, not here (OpenAPI can't describe WS frames).
        These are the pre-upgrade-only HTTP responses; a successful request upgrades
        and never returns a JSON body.
      parameters:
        - name: session
          in: query
          required: true
          schema: { type: string }
          description: session_id from session/canonical or session/ondemand.
      responses:
        '401':
          description: session query param absent/empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          description: session unknown, not Active, or its market is gone/not Live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }

  # ===================== SESSION / CATALOG =====================

  /v1/markets:
    get:
      tags: [session]
      summary: Market catalog + canonical liveness + current-or-next session window. No prices, no per-market auth.
      responses:
        '200':
          description: Always 200, even for an empty catalog ({"markets":[]}, never null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketsResponse' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }

  /v1/instruments:
    get:
      tags: [session]
      summary: >
        Static instrument list for a market. Only id + tick_size are on the wire —
        name/lot_size/price_decimals are NOT returned by the real backend; this
        contract models them as optional, client-defaulted fields (see schema) until
        the backend adds them, per BACKEND-INTEGRATION-PLAN.md §4.
      parameters:
        - name: market
          in: query
          required: true
          schema: { type: string, example: IN }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstrumentsResponse' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }

  /session/canonical:
    post:
      tags: [session]
      summary: >
        Join the live, always-on canonical market for a market tag. Reconnect-safe:
        calling again while already Active on the SAME market returns the same
        session_id/participant_id with zero broker I/O.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinCanonicalRequest' }
      responses:
        '200':
          description: 'status is always the literal "active" on 200.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinCanonicalResponse' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '409':
          description: ErrMarketNotLive / ErrLiveElsewhere / ErrSessionAlreadyLive (error envelope, not reason — different convention from orders).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
        '504': { $ref: '#/components/responses/ErrorEnvelope' }

  /session/ondemand:
    post:
      tags: [session]
      summary: >
        Spin up a one-user ephemeral market instance. A HELD request — does not
        return until the full setup pipeline completes or fails (SetupTimeout 90s
        default). Request body carries an optional `condition` (the scenario picker)
        ahead of backend support — see OnDemandRequest/PracticeCondition; it is a
        documented no-op until the backend reads it (BACKEND-INTEGRATION-PLAN.md §4/§6).
      parameters:
        - name: market
          in: query
          required: true
          schema: { type: string }
        - name: duration
          in: query
          required: false
          schema: { type: integer, default: 30, minimum: 5, maximum: 60 }
          description: Minutes. Absent/empty defaults to 30. Non-integer or outside [5,60] → 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnDemandRequest' }
      responses:
        '200':
          description: Either warming_up (setup succeeded) or insufficient_funds (money-floor gate rejected the account) — both are 200, not an error.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/OnDemandWarmingUpBody' }
                  - { $ref: '#/components/schemas/OnDemandInsufficientFundsBody' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '409':
          description: ErrAlreadyInSession / ErrSessionAlreadyLive (error envelope).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '503':
          description: >
            Setup failed, or SetupTimeout fired. NOT the generic error envelope —
            uses a distinct {status:"failed",reason} shape.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnDemandFailedBody' }

  /session/status:
    get:
      tags: [session]
      summary: >
        Fallback/recovery status read by session id. Pure registry read, works for
        both canonical and on-demand sessions. Vocabulary is DIFFERENT from
        /session/current's — do not conflate the two.
      parameters:
        - name: session
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Shape varies by state — warmup_ends_at/session_ends_at/reason are each omitted (not zeroed) when not applicable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatusBody' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '404':
          description: 'session id not in the registry. Exact body: {"error":"unknown session"}.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }

  /session/current:
    post:
      tags: [session]
      summary: >
        Resolve "does this user have a live session, and where" purely from
        identity — no session_id needed client-side. Vocabulary is DIFFERENT from
        /session/status's — do not conflate the two.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCurrentRequest' }
      responses:
        '200':
          description: warmup_ends_at/session_ends_at populated only when mode=="ondemand".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionCurrentResponse' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '404':
          description: 'User has no session. Exact body: {"error":"no session for user"}.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }

  /session/exit:
    post:
      tags: [session]
      summary: >
        Exit the current session (mode-branched server-side). Canonical: a
        broker-reported "already gone" collapses to 200 (idempotent). On-demand: an
        already-reaped session returns 404, NOT a 200 — this asymmetry is
        deliberate; treat 404 as success for on-demand specifically.
      parameters:
        - name: session
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 'Exact body: {"status":"ended"}.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionExitResponse' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '404':
          description: Unknown session id (canonical) OR an on-demand session already reaped — treat as success for on-demand.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '405': { $ref: '#/components/responses/ErrorEnvelope' }
        '409':
          description: 'Canonical only: session exists but is Starting/Stopping/Ended (double-leave guard).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '500': { $ref: '#/components/responses/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ErrorEnvelope' }
        '504': { $ref: '#/components/responses/ErrorEnvelope' }

components:

  parameters:
    AccountId:
      name: account_id
      in: query
      required: true
      schema: { type: string }
    Country:
      name: country
      in: query
      required: true
      schema: { type: string, enum: [IN, US] }
      description: CASE-SENSITIVE two-letter uppercase. US → 501. Lowercase (e.g. "in") → 400, not a forgiving match.

  responses:
    ErrorEnvelope:
      description: '{"error":"<human message>"}'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:

    # ---- envelopes ----
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ReasonEnvelope:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: snake_case business-reject tag }

    OrderIdResponse:
      type: object
      required: [order_id]
      properties:
        order_id: { type: string, description: 'shape "<account_id>:<seq>"; opaque' }

    # ---- identity ----
    Identity:
      type: object
      required: [user_id]
      properties:
        email: { type: string, description: attribution only, never validated }
        user_id: { type: string, description: required, trusted verbatim as the identity key }
    AccountOpenRequest:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/Identity' }
    AccountOpenResponse:
      type: object
      required: [account_id]
      properties:
        account_id: { type: string, description: opaque broker handle; same value returned on every call for the same user_id }
    Cash:
      type: object
      required: [trading_cash, bank_cash]
      properties:
        trading_cash: { type: integer, format: int64, description: 'signed; may be negative (debt is a legal state). NOT live-updated while a session is active — read balance instead once one exists.' }
        bank_cash: { type: integer, format: int64, description: non-negative }

    # ---- orders ----
    PlaceOrderRequest:
      type: object
      required: [account_id, instrument, side, type, tif, qty]
      properties:
        account_id: { type: string }
        instrument: { type: string }
        side: { type: string, enum: [buy, sell] }
        type: { type: string, enum: [limit, market] }
        tif: { type: string, enum: [gtc, ioc, fok], description: 'FOK is accepted on the wire but NOT honored downstream — the exchange matcher has no FOK branch; a fok order behaves exactly like ioc (partial fills allowed), confirmed unresolved against source.' }
        qty: { type: integer, format: int64, description: '> 0; <=0 is a 422 bad_qty, not a 400 (funnel-level check, not wire-level)' }
        limit_price:
          type: integer
          format: int64
          description: Ticks. Required > 0 iff type==limit (else 422 bad_price); ignored for market.

    CancelOrderRequest:
      type: object
      required: [account_id, order_id]
      properties:
        account_id: { type: string }
        order_id: { type: string }

    ModifyOrderRequest:
      type: object
      required: [account_id, order_id, instrument, side, is_market, new_qty]
      properties:
        account_id: { type: string }
        order_id: { type: string, description: the OLD order to cancel }
        instrument: { type: string }
        side: { type: string, enum: [buy, sell] }
        is_market: { type: boolean, description: 'true→IOC market replacement; false→GTC limit. No tif field — the replacement cannot request FOK.' }
        new_qty: { type: integer, format: int64 }
        new_price:
          type: integer
          format: int64
          description: Required > 0 iff is_market==false; ignored for market.

    ModifyLeg:
      type: object
      properties:
        status: { type: string, description: 'cancel leg: pending|failed. replace leg: accepted|rejected.' }
        order_id: { type: string }
        reason: { type: string }
    ModifyResponse:
      type: object
      required: [modify_status, cancel]
      properties:
        modify_status: { type: string, enum: [ok, partial, rejected] }
        cancel: { $ref: '#/components/schemas/ModifyLeg' }
        replace:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ModifyLeg' }]
          description: null (not an empty object) when the cancel leg was rejected and place was never attempted.
        warning:
          type: string
          description: 'present only on modify_status=="partial". Verbatim text: "original order is being cancelled; replacement was rejected — you may be left with no order".'

    # ---- money ----
    TransferRequest:
      type: object
      required: [account_id, direction, amount]
      properties:
        account_id: { type: string }
        direction: { type: string, enum: [to_bank, to_trading] }
        amount: { type: integer, format: int64, description: '> 0 (checked at the HTTP layer, so this is a 400, unlike order qty/price)' }
        unit: { type: string, description: parsed but completely IGNORED server-side (reserved for a future unit vocabulary) }
    TransferResponse:
      type: object
      required: [available, bank]
      properties:
        available: { type: integer, format: int64 }
        bank: { type: integer, format: int64 }

    # ---- live reads ----
    PositionsResponse:
      type: object
      required: [positions]
      properties:
        positions:
          type: array
          items: { $ref: '#/components/schemas/Position' }
    OrdersResponse:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items: { $ref: '#/components/schemas/OpenOrder' }
    Balance:
      type: object
      required: [available, reserved, settled, bank]
      properties:
        available: { type: integer, format: int64, description: may be negative (debt is a legal state) }
        reserved: { type: integer, format: int64 }
        settled: { type: integer, format: int64 }
        bank: { type: integer, format: int64, description: never negative (DB check constraint) }

    Position:
      type: object
      required: [instrument, qty, reserved_qty, weighted_avg_entry, mark_available, ltp, gross_unrealized]
      properties:
        instrument: { type: string }
        qty: { type: integer, format: int64, description: free-to-sell units }
        reserved_qty: { type: integer, format: int64 }
        weighted_avg_entry: { type: integer, format: int64, description: ticks; 0 iff flat }
        mark_available: { type: boolean, description: 'true once the exchange instance is wired AND the instrument has printed a trade; false for a cold/untraded instrument. NOT an unconditional false.' }
        ltp: { type: integer, format: int64, description: 0 when mark_available false }
        gross_unrealized: { type: integer, format: int64, description: 0 when mark_available false. There is no net-unrealized field — intentionally absent, not a placeholder. }

    OpenOrder:
      type: object
      required: [order_id, instrument, side, is_market, limit_price, orig_qty, remaining_qty, filled_qty, reserved_cash, reserved_units, status, cancel_in_flight]
      properties:
        order_id: { type: string }
        instrument: { type: string }
        side: { type: string, enum: [buy, sell, unknown], description: unknown is the zero/out-of-range defensive value }
        is_market: { type: boolean }
        limit_price: { type: integer, format: int64, description: ticks; 0 for market }
        orig_qty: { type: integer, format: int64 }
        remaining_qty: { type: integer, format: int64 }
        filled_qty: { type: integer, format: int64, description: 'derived at the HTTP edge as orig_qty - remaining_qty' }
        reserved_cash: { type: integer, format: int64, description: 0 for sell reservations }
        reserved_units: { type: integer, format: int64, description: 0 for buy reservations }
        status:
          type: string
          enum: [unknown, working, partially_filled, filled, cancelled, rejected]
          description: Only working/partially_filled ever appear on THIS endpoint (terminal orders are deleted from the shard on settlement) — but the enum itself is 6-valued.
        cancel_in_flight: { type: boolean }

    Observation:
      type: object
      required: [balance, positions, orders, recent_trades, trades_degraded]
      properties:
        balance: { $ref: '#/components/schemas/Balance' }
        positions:
          type: array
          items: { $ref: '#/components/schemas/Position' }
        orders:
          type: array
          items: { $ref: '#/components/schemas/OpenOrder' }
        recent_trades:
          type: array
          items: { $ref: '#/components/schemas/Trade' }
          description: 'hardcoded limit of 20, newest-first. No client-adjustable count exists (no recent_n param).'
        trades_degraded: { type: boolean, description: 'true iff the durable trades-read failed; the live half (balance/positions/orders) is unaffected either way.' }

    # ---- durable reads ----
    Trade:
      type: object
      required: [trade_id, instrument, direction, quantity, entry_price, exit_price, entry_at, exit_at, gross_pnl, total_costs, net_pnl, pnl_pct, exit_reason]
      properties:
        trade_id: { type: string }
        instrument: { type: string }
        direction: { type: string, description: 'free-form string at this seam ("long"/"short" observed); not a closed Go enum at the broker/reads boundary' }
        quantity: { type: integer, format: int64 }
        entry_price: { type: integer, format: int64 }
        exit_price: { type: integer, format: int64 }
        entry_at: { type: string, format: date-time, description: RFC3339 }
        exit_at: { type: string, format: date-time, description: RFC3339; the keyset-pagination column }
        gross_pnl: { type: integer, format: int64, description: signed }
        total_costs: { type: integer, format: int64, description: '>= 0' }
        net_pnl: { type: integer, format: int64, description: signed }
        pnl_pct:
          type: number
          format: float
          description: 'float32 on the wire — the one deliberate float exception on this whole surface (a display percentage, not money/price).'
        exit_reason: { type: string, description: free-form string, not a closed enum at this seam }
    TradesPage:
      type: object
      required: [trades, next_before]
      properties:
        trades:
          type: array
          items: { $ref: '#/components/schemas/Trade' }
        next_before:
          type: string
          format: date-time
          nullable: true
          description: RFC3339. null = last page.

    PnlSummary:
      type: object
      required: [trade_count, gross_pnl, total_costs, net_pnl, win_count, loss_count]
      properties:
        trade_count: { type: integer }
        gross_pnl: { type: integer, format: int64 }
        total_costs: { type: integer, format: int64 }
        net_pnl: { type: integer, format: int64 }
        win_count: { type: integer }
        loss_count: { type: integer, description: 'breakeven (net_pnl==0) counted in neither' }

    CostLine:
      type: object
      required: [name, amount]
      properties:
        name: { type: string, description: 'IN: stt/exchange/sebi/stamp/gst/autosquare_fee (brokerage is never emitted at the per-trade level, always 0 by design)' }
        amount: { type: integer, format: int64 }
    CostsTrade:
      type: object
      required: [trade_id, lines, total]
      properties:
        trade_id: { type: string }
        lines:
          type: array
          items: { $ref: '#/components/schemas/CostLine' }
          description: only non-zero lines present
        total: { type: integer, format: int64 }
    CostsPage:
      type: object
      required: [trades, next_before]
      properties:
        trades:
          type: array
          items: { $ref: '#/components/schemas/CostsTrade' }
          description: 'key is "trades" (not "per_trade") — confirmed against source.'
        next_before:
          type: string
          format: date-time
          nullable: true
    CostsSummary:
      type: object
      required: [trade_count, lines, total]
      properties:
        trade_count: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/CostLine' }
          description: zero-sum lines dropped, not emitted as amount:0
        total: { type: integer, format: int64 }

    # ---- market-data history ----
    Bar:
      type: object
      required: [start, end, open, high, low, close, volume]
      properties:
        start: { type: string, description: naive-local ISO, no offset/Z suffix }
        end: { type: string, description: naive-local ISO, exclusive, == start + timeframe }
        open: { type: integer, format: int64 }
        high: { type: integer, format: int64 }
        low: { type: integer, format: int64 }
        close: { type: integer, format: int64 }
        volume: { type: integer, format: int64 }
    CandleResponse:
      type: object
      required: [market, instrument, timeframe, timezone, from, to, candles, next_cursor]
      properties:
        market: { type: string }
        instrument: { type: string }
        timeframe: { type: string, enum: ["1m", "5m", "30m", "60m"] }
        timezone: { type: string, example: Asia/Kolkata, description: resolved IANA zone name }
        from: { type: string, description: echoed verbatim from the request query string }
        to: { type: string, description: echoed verbatim from the request query string }
        candles:
          type: array
          items: { $ref: '#/components/schemas/Bar' }
          description: never null; empty window → []
        next_cursor:
          type: string
          nullable: true
          description: naive-local ISO string, non-RFC3339 (different cursor format from broker/reads' before cursor). null = last page.

    # ---- session / catalog ----
    MarketSession:
      type: object
      required: [opens_at, closes_at, duration, wall_clock]
      properties:
        opens_at: { type: string, format: date-time, description: 'RFC3339 UTC (plain, not nano). Literal configured open time, not open-minus-preopen-lead.' }
        closes_at: { type: string, format: date-time, description: RFC3339 UTC (plain, not nano) }
        duration: { type: string, description: 'Go time.Duration.String(), e.g. "6h15m0s"' }
        wall_clock: { type: string, example: "09:15–15:30 IST", description: human string from config HH:MM plus resolved tz abbreviation }
    Market:
      type: object
      required: [tag, active, session]
      properties:
        tag: { type: string, example: IN }
        active: { type: boolean, description: 'true iff a Live canonical market record currently exists for this tag; on-demand instances never affect this flag.' }
        session: { $ref: '#/components/schemas/MarketSession' }
    MarketsResponse:
      type: object
      required: [markets]
      properties:
        markets:
          type: array
          items: { $ref: '#/components/schemas/Market' }

    Instrument:
      type: object
      required: [id, tick_size]
      properties:
        id: { type: string, example: ACME }
        tick_size: { type: integer, format: int64, description: smallest price increment, in ticks }
        name:
          type: string
          nullable: true
          description: >
            NOT returned by the real backend today (confirmed gap). Optional here so
            the frontend can default it client-side (e.g. to the instrument id) until
            the backend adds it — see BACKEND-INTEGRATION-PLAN.md §4/§6. Remove the
            default, not this field, once the backend ships it.
        lot_size:
          type: integer
          format: int64
          nullable: true
          description: Same gap/handling as name — client-defaults (e.g. 1) until the backend adds it.
        price_decimals:
          type: integer
          nullable: true
          description: Same gap/handling as name — client-defaults (e.g. 2) until the backend adds it.
    InstrumentsResponse:
      type: object
      required: [market, instruments]
      properties:
        market: { type: string }
        instruments:
          type: array
          items: { $ref: '#/components/schemas/Instrument' }

    JoinCanonicalRequest:
      type: object
      required: [user, market]
      properties:
        user: { $ref: '#/components/schemas/Identity' }
        market: { type: string, description: a configured market tag }
    JoinCanonicalResponse:
      type: object
      required: [session_id, participant_id, status]
      properties:
        session_id: { type: string }
        participant_id: { type: string }
        status: { type: string, enum: [active], description: always the literal "active" on 200 }

    PracticeCondition:
      type: string
      enum: [normal, calm, busy, thin, dispersion]
      description: >
        The Practice setup screen's market-scenario picker. Values map to simulation-agents
        scenario names: normal=Normal Day, calm=Calm Day, busy=Active Market, thin=Thin Market,
        dispersion=Two Camps. See BACKEND-INTEGRATION-PLAN.md §4/§6.
    OnDemandRequest:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/Identity' }
        condition:
          allOf: [{ $ref: '#/components/schemas/PracticeCondition' }]
          description: Optional. See PracticeCondition — currently a no-op everywhere it's read.
    OnDemandWarmingUpBody:
      type: object
      required: [status, session_id, warmup_ends_at, session_ends_at]
      properties:
        status: { type: string, enum: [warming_up] }
        session_id: { type: string }
        warmup_ends_at: { type: string, description: 'RFC3339Nano UTC, e.g. "2026-03-15T10:05:00.000000000Z" — NOT plain RFC3339.' }
        session_ends_at: { type: string, description: RFC3339Nano UTC }
    OnDemandInsufficientFundsBody:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [insufficient_funds] }
        message: { type: string }
    OnDemandFailedBody:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [failed] }
        reason: { type: string, description: raw underlying cause string, e.g. "install_failed: ..." }

    SessionStatusBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [warming_up, ready, failed, ended]
          description: 'DIFFERENT vocabulary from /session/current''s status field for the SAME underlying states (Starting→warming_up, Active→ready, Stopping/Ended→ended, Failed→failed). Do not conflate the two enums.'
        warmup_ends_at: { type: string, nullable: true, description: RFC3339Nano. Omitted (not present), not zeroed, when not applicable. }
        session_ends_at: { type: string, nullable: true, description: RFC3339Nano. Omitted when not applicable. }
        reason: { type: string, nullable: true, description: present only when status=="failed" }

    SessionCurrentRequest:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [user_id]
          properties:
            user_id: { type: string }
    SessionCurrentResponse:
      type: object
      required: [session_id, mode, market, status]
      properties:
        session_id: { type: string }
        mode: { type: string, enum: [canonical, ondemand] }
        market: { type: string }
        status:
          type: string
          enum: [starting, active, stopping, ended, failed]
          description: 'Raw SessionState.String() vocabulary — DIFFERENT from /session/status''s UI-facing labels for the same states. Do not conflate the two enums.'
        warmup_ends_at: { type: string, nullable: true, description: RFC3339Nano. Populated ONLY when mode=="ondemand"; canonical sessions never carry this. }
        session_ends_at: { type: string, nullable: true, description: RFC3339Nano. Populated ONLY when mode=="ondemand".}
        spinup_phase: { type: string, nullable: true, description: 'Non-null only when status=="starting" (on-demand spinup in flight). Values: "agents" (BringUp call in flight), "exchange" (exchange construction in flight). Null/absent in all other states.' }

    SessionExitResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ended] }
